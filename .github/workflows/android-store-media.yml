name: Android store screenshots
on:
  workflow_dispatch:
  push:
    branches: ['codex/android-store-media']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm ci && npm run build && npx cap sync android
      - run: sudo chmod 666 /dev/kvm
      - name: Capture the installed app during real study flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash android/gradlew --no-daemon -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.drlatham.nursinglearning.ReleaseSmokeTest
            adb pull /sdcard/Android/data/com.drlatham.nursinglearning/files/store-screenshots android-store-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nursing-android-store-screenshots
          retention-days: 7
          path: |
            android-store-screenshots/
            android/app/build/reports/androidTests/
