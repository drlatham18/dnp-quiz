name: Native release proof
on:
  workflow_dispatch:
  push:
    branches: ['codex/mobile-release-proof']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm ci && npm test && npm run build && npx cap sync android
      - name: Build release package and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease lintRelease
      - name: Enable KVM for isolated emulator
        run: sudo chmod 666 /dev/kvm
      - name: Install and exercise app on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Package signing tool and capture
        if: always()
        run: |
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android/app/build/outputs/apk/release/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nursing-android-release-proof
          retention-days: 7
          path: |
            android/app/build/outputs/apk/release/
            android/app/build/outputs/bundle/release/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci && npm test && npm run build && npx cap sync ios
      - name: Add isolated UI smoke target
        run: |
          gem install xcodeproj -v 1.27.0 --no-document --user-install
          ruby tools/add-ios-smoke-target.rb
      - name: Test actual packaged app on iPhone
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme ReleaseSmoke -destination 'platform=iOS Simulator,name=iPhone 16' -derivedDataPath build-ios -resultBundlePath mobile-proof.xcresult CODE_SIGNING_ALLOWED=NO test > /tmp/mobile-ios-test.log 2>&1 || { tail -120 /tmp/mobile-ios-test.log; exit 1; }
      - name: Build simulator release and capture iPhone and iPad
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Release -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build > /tmp/mobile-ios-build.log 2>&1 || { tail -100 /tmp/mobile-ios-build.log; exit 1; }
          python3 tools/capture-ios.py
          ditto -c -k --keepParent build-ios/Build/Products/Release-iphonesimulator/App.app nursing-simulator.zip
      - name: Compile unsigned device archive
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -destination generic/platform=iOS -configuration Release -archivePath build-ios/App.xcarchive CODE_SIGNING_ALLOWED=NO archive > /tmp/mobile-ios-device.log 2>&1 || { tail -100 /tmp/mobile-ios-device.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nursing-ios-release-proof
          retention-days: 7
          path: |
            nursing-simulator.zip
            ios-screenshots/
            mobile-proof.xcresult/
            build-ios/App.xcarchive/
            /tmp/mobile-ios-*.log
