name: Publish signed Android download
on:
  push:
    branches: [main]
    paths: ['downloads/**', 'release/NOTES-1.0.md', '.github/workflows/publish-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed artifact identity
        working-directory: downloads
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish approved free release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --draft --verify-tag --title 'Nursing Learning Companion 1.0 — Free Study Edition' --notes-file release/NOTES-1.0.md
          gh release upload v1.0.0 downloads/Nursing-Learning-1.0.apk downloads/SHA256SUMS.txt --clobber
          gh release edit v1.0.0 --title 'Nursing Learning Companion 1.0 — Free Study Edition' --notes-file release/NOTES-1.0.md --draft=false --latest
